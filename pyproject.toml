[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-research-consensus"
version = "0.1.0"
description = "Fixed three-agent LangGraph research workflow with transparent consensus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pydantic-settings>=2.0,<3.0",
  "tavily-python>=0.7,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
